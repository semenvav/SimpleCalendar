name: CI

# Every push is tested; a push that passes also publishes an image to GHCR. Nothing here deploys:
# which build runs where is decided on the server, by the tag in its .env.
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

# A newer push to the same branch makes the older run pointless. It also keeps two runs from
# reaching for the same version number at once.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # Caches Gradle and checks the wrapper jar against Gradle's published checksums.
      - uses: gradle/actions/setup-gradle@v6

      - name: Backend tests
        run: ./gradlew test --console=plain

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend typecheck and build
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm run build

  image:
    # Pull requests — including ones from forks — are tested, never published.
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      number: ${{ steps.version.outputs.number }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The next version number is worked out from the tags already pushed.
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Every published build of master gets a number of its own: the series from VERSION, then
      # one more than the highest already tagged — 0.5.1, 0.5.2, 0.5.3. Editing VERSION by hand
      # starts the next series at .1 again. The number is only tagged in git once the image is
      # really in the registry (see below), so a failed build leaves no gap.
      - name: Work out the version
        id: version
        run: |
          set -euo pipefail
          series=$(tr -d '[:space:]' < VERSION)
          number=''
          case "$GITHUB_REF" in
            "refs/heads/${{ github.event.repository.default_branch }}")
              last=$(git tag --list "v$series.*" | sed "s|^v$series\.||" | grep -E '^[0-9]+$' | sort -n | tail -1 || true)
              number="$series.$(( ${last:-0} + 1 ))"
              label="$number"
              ;;
            refs/tags/v*)
              label="${GITHUB_REF_NAME#v}"
              ;;
            *)
              # A branch build is not a release: it says which commit it is instead of a number.
              label="${GITHUB_REF_NAME}@${GITHUB_SHA::7}"
              ;;
          esac
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "label=$label" >> "$GITHUB_OUTPUT"
          echo "This build calls itself $label"

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/simplecalendar
          # `latest` means "tip of master", nothing else — set explicitly rather than inferred.
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.number }},enable=${{ steps.version.outputs.number != '' }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Only the runtime stage reads it, so a new number never rebuilds the server.
          build-args: |
            SC_VERSION=${{ steps.version.outputs.label }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # A separate job so that the number is recorded in git only after the image is published, and
  # with the one permission that needs write access kept away from the build itself.
  tag:
    if: needs.image.outputs.number != ''
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # A tag pushed with GITHUB_TOKEN does not start another workflow run, so this cannot loop
      # back into the build above.
      - name: Tag this commit with its version
        run: |
          set -euo pipefail
          git tag "v${{ needs.image.outputs.number }}"
          git push origin "v${{ needs.image.outputs.number }}"
